[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "homework-2/tests", "homework-3/tests"]
pythonpath = [".", "homework-2", "homework-3/mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = [
  "EXE002", # External-volume mount marks regular source files executable.
  "UP045",  # Keep Optional syntax compatible with Python 3.9's parser.
]
